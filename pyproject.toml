[project]
name = "kairox"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Your GitHub Name", email = "lkatiyar12@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "bcrypt>=5.0.0",
    "celery[redis]>=5.6.3",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "jose>=1.0.0",
    "parsedatetime>=2.6",
    "passlib>=1.7.4",
    "psycopg>=3.3.6",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pytest-asyncio>=1.4.0",
    "python-dateutil>=3.0.0",
    "python-jose>=3.5.0",
    "pytz>=2026.5",
    "redis>=6.4.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

dependencies = [
    "argon2-cffi>=25.1.0",
    "celery>=5.6.3",
    "logger>=1.4",
    "pip>=26.2.2",
    "psycopg>=3.3.6",
    "pydantic[email]>=2.14.1",
    "pytest>=9.1.1",
    "redis>=8.1.0",
    "requests>=2.34.2",
]

[project.scripts]
kairox = "kairox:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "schemathesis>=4.32.4",
]
