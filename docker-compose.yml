
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    container_name: kairox-redis

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: kairox-worker
    container_name: kairox-worker
    env_file:
      - backend/.env
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

volumes:
  redis-data:
